<script>/**
 * DSH Plugin Integration v1 — internal browser runtime (not a product feature).
 *
 * A tiny, dependency-free, idempotent-singleton coordinator for independent
 * DSH page plugins. It exists so plugins can share a small capability
 * contract (register / status snapshot / lifecycle hooks) through one neutral
 * global, WITHOUT creating any user-visible unified UI (no dock, no overview,
 * no console, no brand).
 *
 * Why this exists: independent DSH page plugins each inject their own script.
 * When several are present they need one stable seam between them — for
 * example, a host that embeds this plugin's compact capsule without reaching
 * into its DOM classes. This runtime is that seam.
 *
 * Contract (each plugin registers one module):
 * {
 *   id,            // unique module id, e.g. 'quota'
 *   kind,          // 'resource' | 'control' | 'ambient'  (informational)
 *   title,         // short display label (informational only)
 *   getSnapshot(), // () => plain JSON-able status object  (guarded)
 *   actions,       // { name: fn() } actions controllable by peers (guarded)
 *   mountCompact?,// (container) => void — render own compact self into a host-provided node
 *   unmountCompact?, // () => void — take the compact self back out
 *   openDetail?    // () => void — open full detail
 * }
 *
 * Guarantees:
 *  - Idempotent: repeated injection of this file never creates a second runtime.
 *  - Order-independent: late-loading plugins and late-loading shells both work.
 *  - Failure isolation: a throwing listener or module never breaks the runtime.
 *  - Version boundary: a future v2 uses a different key; here we stay at v1.
 *  - NO DOM is touched by this runtime itself; UI stays in each plugin.
 *
 * The runtime may be built and unit-tested standalone (see tests/contract.test.mjs).
 */

/* global window, document */
(function (global) {
	'use strict';

	var KEY = 'DSH_PLUGIN_INTEGRATION_V1';
	var VERSION = 1;

	// Already installed → reuse (and if a mismatched version exists, leave it alone).
	if (global[KEY]) return;

	var modules = new Map(); // id -> module
	var listeners = new Set(); // listener fns

	function safe(fn, label) {
		try {
			return fn();
		} catch (error) {
			// A failing module/listener must never poison the runtime.
			try {
				// eslint-disable-next-line no-console
				if (global.console && global.console.warn) global.console.warn('[dsh-plugin-integration]', label || '', error);
			} catch { /* never throw from the safety net */ }
			return undefined;
		}
	}

	function broadcast(event) {
		var snapshot = Array.from(listeners);
		for (var i = 0; i < snapshot.length; i++) {
			// Capture to avoid a listener removing itself mid-loop breaking the rest.
			(function (fn) { safe(function () { fn(event); }, 'listener'); })(snapshot[i]);
		}
	}

	var api = {
		version: VERSION,
		key: KEY,

		/** Register (or update) a module. Returns true when newly added. */
		register: function (module) {
			if (!module || typeof module.id !== 'string' || !module.id) return false;
			var isNew = !modules.has(module.id);
			modules.set(module.id, module);
			// Notify peers so a late-registering module is discovered by an
			// already-running shell, and vice versa.
			safe(function () { broadcast({ type: isNew ? 'register' : 'update', id: module.id, module: module }); }, 'register.broadcast');
			return isNew;
		},

		/** Remove a module. Returns true when it existed. */
		unregister: function (id) {
			if (!modules.has(id)) return false;
			modules.delete(id);
			safe(function () { broadcast({ type: 'unregister', id: id }); }, 'unregister.broadcast');
			return true;
		},

		/** Return a module by id, or null. */
		get: function (id) {
			return modules.get(id) || null;
		},

		/** Whether a module with this id is registered. */
		has: function (id) {
			return modules.has(id);
		},

		/** List known modules (array of `{ id, kind, title }`), stable order. */
		list: function () {
			return Array.from(modules.values()).map(function (m) {
				return { id: m.id, kind: m.kind || '', title: m.title || '' };
			});
		},

		/**
		 * Subscribe to integration events. Returns an unsubscribe function.
		 * Events: { type: 'register'|'update'|'unregister', id }.
		 */
		subscribe: function (listener) {
			if (typeof listener !== 'function') return function () {};
			listeners.add(listener);
			var active = true;
			return function () {
				if (!active) return;
				active = false;
				listeners.delete(listener);
			};
		},

		/** Read a module's status snapshot defensively (null when N/A or it throws). */
		snapshotOf: function (id) {
			var m = modules.get(id);
			if (!m || typeof m.getSnapshot !== 'function') return null;
			var value = safe(function () { return m.getSnapshot(); }, 'snapshot.' + id);
			return value === undefined ? null : value;
		},

		/** Invoke one of a module's actions defensively; returns true when called. */
		callAction: function (id, name) {
			var m = modules.get(id);
			if (!m || !m.actions || typeof m.actions[name] !== 'function') return false;
			safe(function () { m.actions[name](); }, 'action.' + id + '.' + name);
			return true;
		},

		/** Ask a module to render its compact self into a host-provided container. */
		mountCompact: function (id, container) {
			var m = modules.get(id);
			if (!m || typeof m.mountCompact !== 'function' || !container) return false;
			safe(function () { m.mountCompact(container); }, 'mountCompact.' + id);
			return true;
		},

		/** Ask a module to detach its compact self. */
		unmountCompact: function (id) {
			var m = modules.get(id);
			if (!m || typeof m.unmountCompact !== 'function') return false;
			safe(function () { m.unmountCompact(); }, 'unmountCompact.' + id);
			return true;
		}
	};

	global[KEY] = api;
})(typeof window !== 'undefined' ? window : globalThis);

    style.id = 'dsh-quota-style';
    style.textContent = "/* Both buttons share one visual shell; the lock is never nested in a button. */\n#dsh-quota-panel {\n  position: fixed;\n  z-index: 900;\n  width: 128px;\n  max-width: calc(100vw - 16px);\n  height: 28px;\n  color: var(--dsw-alias-label-primary, #1b1b1c);\n  font-family: var(--dsw-font-family, -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Microsoft YaHei\", sans-serif);\n  font-size: 12px;\n  line-height: 1.4;\n}\n#dsh-quota-panel, #dsh-quota-panel * { box-sizing: border-box; }\n#dsh-quota-panel [hidden] { display: none !important; }\n#dsh-quota-panel.is-hosted { position: relative; }\n#dsh-quota-panel.is-expanded { width: var(--dsh-quota-width, 168px); }\n#dsh-quota-capsule {\n  appearance: none;\n  display: flex;\n  position: absolute;\n  inset: auto 0 0;\n  width: 100%;\n  height: 34px;\n  margin: 0;\n  padding: 0 8px;\n  border: 1px solid var(--dsw-alias-border-l2, rgba(0,0,0,.1));\n  border-radius: 17px;\n  background: var(--dsw-alias-bg-layer-2, #fff);\n  color: inherit;\n  box-shadow: none;\n  font: inherit;\n  text-align: center;\n  cursor: grab;\n  user-select: none;\n  touch-action: none;\n  transition: height 180ms ease, border-radius 180ms ease;\n}\n#dsh-quota-panel.is-expanded #dsh-quota-capsule {\n  height: auto;\n  border-radius: 28px;\n  padding: 32px 14px 14px;\n}\n#dsh-quota-panel.is-expanded #dsh-quota-detail {\n  width: 100%;\n  grid-template-columns: 1fr;\n  height: auto;\n  gap: 10px;\n  margin-right: 0;\n}\n#dsh-quota-panel.is-locked #dsh-quota-capsule { cursor: pointer; }\n#dsh-quota-panel.is-dragging #dsh-quota-capsule { cursor: grabbing; transition: none; }\n#dsh-quota-panel :focus-visible { outline: 2px solid var(--dsw-static-deepseek-500, #4176e6); outline-offset: 3px; }\n#dsh-quota-compact-row, #dsh-quota-detail {\n  display: grid;\n  grid-template-columns: repeat(var(--quota-columns, 3), minmax(0, 1fr));\n  gap: 2px;\n  align-items: center;\n  width: 100%;\n  height: 100%;\n}\n#dsh-quota-panel .dsh-capsule-pair { display: flex; justify-content: center; align-items: center; gap: 2px; white-space: nowrap; }\n#dsh-quota-panel .dsh-capsule-dot { width: 5px; height: 5px; flex: none; border-radius: 50%; background: var(--dsw-static-neutral-bluish-400, #adb2b8); }\n#dsh-quota-panel .dsh-capsule-dot.state-ok { background: var(--dsw-static-green-500, #22c55e); }\n#dsh-quota-panel .dsh-capsule-dot.state-warn { background: var(--dsw-static-amber-500, #f59e0b); }\n#dsh-quota-panel .dsh-capsule-dot.state-error { background: var(--dsw-static-red-500, #ef4444); }\n#dsh-quota-panel .dsh-capsule-dot.state-stale { background: transparent; border: 1px solid var(--dsw-static-neutral-bluish-400, #adb2b8); }\n#dsh-quota-panel .dsh-capsule-item { font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }\n#dsh-quota-panel .dsh-quota-detail-column { display: flex; min-width: 0; flex-direction: column; align-items: stretch; gap: 4px; text-align: left; }\n#dsh-quota-panel .dsh-quota-detail-name { font-size: 11px; font-weight: 600; line-height: 15px; white-space: nowrap; }\n#dsh-quota-panel .dsh-quota-detail-value { display: grid; gap: 4px; font-size: 11px; line-height: 15px; font-variant-numeric: tabular-nums; }\n#dsh-quota-panel .quota-line { display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; }\n#dsh-quota-panel .quota-balance { font-size: 17px; line-height: 22px; font-weight: 500; }\n#dsh-quota-panel .quota-window { display: grid; gap: 2px; }\n#dsh-quota-panel .quota-track { height: 3px; border-radius: 2px; overflow: hidden; background: var(--dsw-alias-border-l2, #e5e5e7); }\n#dsh-quota-panel .quota-fill { display: block; width: 0; height: 100%; background: var(--dsw-alias-label-secondary, #61666b); }\n#dsh-quota-panel .quota-reset { font-size: 10px; line-height: 12px; color: var(--dsw-alias-label-secondary, #61666b); }\n#dsh-quota-panel .quota-money { font-size: 10px; }\n#dsh-quota-panel .dsh-quota-detail-column.is-balance { flex-direction: row; align-items: center; justify-content: space-between; }\n#dsh-quota-panel .is-balance .quota-balance { font-size: 13px; line-height: 18px; }\n#dsh-quota-panel [data-state=\"warn\"] .dsh-quota-detail-name { color: var(--dsw-static-amber-500, #b77d10); }\n#dsh-quota-panel [data-state=\"error\"] .dsh-quota-detail-name { color: var(--dsw-static-red-500, #dc4545); }\n#dsh-quota-panel .state-stale, #dsh-quota-panel .state-unknown { color: var(--dsw-alias-label-secondary, #61666b); }\n#dsh-quota-lock {\n  appearance: none;\n  position: absolute;\n  right: 12px;\n  bottom: auto;\n  top: calc(28px - var(--quota-detail-height, 380px) + 5px);\n  display: grid;\n  place-items: center;\n  width: 24px;\n  height: 24px;\n  margin: 0;\n  padding: 3px;\n  border: 0;\n  border-radius: 50%;\n  background: transparent;\n  color: var(--dsw-alias-label-secondary, #61666b);\n  cursor: pointer;\n}\n#dsh-quota-lock:hover { color: var(--dsw-alias-label-primary, #1b1b1c); }\n#dsh-quota-lock[aria-pressed=\"true\"] { color: var(--dsw-alias-label-primary, #1b1b1c); }\n#dsh-quota-lock svg { width: 13px; height: 13px; pointer-events: none; }\n#dsh-quota-lock .lock-shackle { transform: translateX(3px); }\n#dsh-quota-lock[aria-pressed=\"true\"] .lock-shackle { transform: none; }\n#dsh-quota-refresh {\n  appearance: none;\n  position: absolute;\n  top: auto;\n  bottom: calc(var(--quota-detail-height, 380px) - 32px);\n  right: 38px;\n  display: grid;\n  place-items: center;\n  width: 24px;\n  height: 24px;\n  padding: 0;\n  border: 0;\n  border-radius: 50%;\n  background: transparent;\n  color: var(--dsw-alias-label-secondary, #61666b);\n  cursor: pointer;\n  font: 18px/1 sans-serif;\n}\n#dsh-quota-refresh:hover { color: var(--dsw-alias-label-primary, #1b1b1c); }\n#dsh-quota-refresh.is-refreshing { animation: dsh-quota-spin 700ms linear infinite; }\n@keyframes dsh-quota-spin { to { transform: rotate(360deg); } }\n@media (prefers-reduced-motion: reduce) { #dsh-quota-capsule { transition: none; } }\n";
    document.head.appendChild(style);
  }

  function createPanel() {
    var panel = el('div');
    panel.id = panelId;
    panel.dataset.version = VERSION;
    panel.style.setProperty('--quota-columns', String(Math.max(1, ROWS.length)));

    // Collapsed capsule: one dot + value pair per provider, no text labels.
    capsuleEl = el('button', 'dsh-quota-capsule');
    capsuleEl.id = capsuleId;
    capsuleEl.type = 'button';
    capsuleEl.setAttribute('aria-label', t('ariaExpand'));
    capsuleEl.setAttribute('aria-expanded', 'false');
    capsuleEl.setAttribute('aria-controls', cardId);
    compactEl = el('span', 'dsh-quota-compact-row');
    compactEl.id = 'dsh-quota-compact-row';
    for (var i = 0; i < ROWS.length; i++) {
      var spec = ROWS[i];
      var dot = el('span', 'dsh-capsule-dot state-loading');
      var valueEl = el('span', 'dsh-capsule-item state-loading', '…');
      CAPSULE_DOTS[spec.id] = dot;
      CAPSULE_VALUES[spec.id] = valueEl;
      var pair = el('span', 'dsh-capsule-pair');
      pair.appendChild(dot);
      pair.appendChild(valueEl);
      compactEl.appendChild(pair);
    }
    capsuleEl.appendChild(compactEl);
    capsuleEl.addEventListener('click', function () {
      if (didDrag) { didDrag = false; return; }
      setExpanded(!expanded);
    });
    installDrag();
    panel.appendChild(capsuleEl);

    detailEl = el('span', 'dsh-quota-detail-grid');
    detailEl.id = cardId;
    detailEl.hidden = true;
    for (var i = 0; i < ROWS.length; i++) {
      var detailColumn = el('span', 'dsh-quota-detail-column');
      if (kindOf(ROWS[i]) === 'balance') detailColumn.classList.add('is-balance');
      var shortName = ROWS[i].label.replace(/^OpenCode Go$/i, 'OpenCode').replace(/^Command Code$/i, 'CommandCode');
      detailColumn.appendChild(el('span', 'dsh-quota-detail-name', shortName));
      var detailValue = el('span', 'dsh-quota-detail-value state-loading', '…');
      DETAIL_VALUES[ROWS[i].id] = detailValue;
      detailColumn.appendChild(detailValue);
      detailEl.appendChild(detailColumn);
    }
    capsuleEl.appendChild(detailEl);
    lockEl = el('button', 'dsh-quota-lock');
    lockEl.id = 'dsh-quota-lock';
    lockEl.type = 'button';
    lockEl.hidden = true;
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 16 16');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.3');
    ['M5 7V5a3 3 0 0 1 6 0v2', 'M4 7h8v7H4z', 'M8 10v1.5'].forEach(function (path, index) {
      var node = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      node.setAttribute('d', path);
      if (index === 0) node.setAttribute('class', 'lock-shackle');
      svg.appendChild(node);
    });
    lockEl.appendChild(svg);
    lockEl.addEventListener('click', function () { setLocked(!locked); });
    panel.appendChild(lockEl);
    refreshEl = el('button', 'dsh-quota-refresh');
    refreshEl.id = 'dsh-quota-refresh';
    refreshEl.type = 'button';
    refreshEl.hidden = true;
    refreshEl.setAttribute('aria-label', LANG === 'zh' ? '刷新额度' : 'Refresh quota');
    refreshEl.title = refreshEl.getAttribute('aria-label');
    refreshEl.textContent = '↻';
    refreshEl.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      refreshEl.classList.add('is-refreshing');
      refreshAll().finally(function () { refreshEl.classList.remove('is-refreshing'); });
    });
    panel.appendChild(refreshEl);
    try { locked = localStorage.getItem('dsh.quota.locked') === '1'; } catch (e) { locked = false; }
    setLocked(locked);
    return panel;
  }

  async function refreshProvider(spec) {
    // The route always answers with the normalized envelope; a transport
    // failure or a non-JSON body is turned into the same shape here so the
    // render path only ever sees ok+data or ok=false+error.
    var payload;
    try {
      var response = await fetch('/api/quota/' + encodeURIComponent(spec.id), { cache: 'no-store', signal: AbortSignal.timeout(35000) });
      var text = await response.text();
      try {
        payload = JSON.parse(text);
      } catch (e) {
        payload = { ok: false, error: { code: 'invalid-body', status: response.status, message: 'non-JSON response' } };
      }
    } catch (error) {
      payload = { ok: false, error: { code: 'network', message: String(error && error.message ? error.message : error) } };
    }
    if (!payload || typeof payload !== 'object') payload = { ok: false, error: { code: 'invalid-body', message: 'empty response' } };
    applyRender(spec, payload);
  }

  async function refreshAll() {
    if (refreshing) return;
    refreshing = true;
    try {
      await Promise.all(ROWS.map(function (spec) { return refreshProvider(spec); }));
    } finally {
      refreshing = false;
    }
  }

  function mount() {
    if (document.getElementById(panelId)) return;
    injectStyles();
    panelEl = createPanel();
    panelEl.classList.toggle('is-locked', locked);
    pos = readPos(); // restore a dragged position before the first paint
    document.body.appendChild(panelEl);
    anchorPanel();
    // Fonts/paint land after the first layout: re-anchor once, then keep the
    // widget inside the viewport on resize.
    // Re-anchor on the next two frames: fonts and the capsule's own height land
    // after the first layout, and a default computed before that would sit on
    // the settings row. anchorPanel only re-runs the default while the user has
    // not saved a position, so a placed widget is never moved.
    requestAnimationFrame(function () {
      anchorPanel();
      requestAnimationFrame(anchorPanel);
    });
    window.addEventListener('resize', function () {
      anchorPanel();
    });
    new ResizeObserver(anchorPanel).observe(panelEl);
    // DSH loads its sidebar asynchronously; keep the default clear of its footer.
    var anchorFrame = 0;
    new MutationObserver(function (records) {
      if (pos || mountSlot || anchorFrame || !records.some(function (record) { return !panelEl.contains(record.target); })) return;
      anchorFrame = requestAnimationFrame(function () { anchorFrame = 0; anchorPanel(); });
    }).observe(document.body, { childList: true, subtree: true });
    refreshAll();
    setInterval(function () {
      if (!document.hidden) refreshAll();
    }, AUTO_MS);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refreshAll();
    });
    // Esc collapses the card from anywhere (the card is not a focus trap, so
    // this is a convenience rather than an escape hatch) and hands focus back
    // to the capsule that opened it.
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape' || !panelEl || !panelEl.classList.contains('is-expanded')) return;
      setExpanded(false);
      try { capsuleEl.focus(); } catch (e) { /* ignore */ }
    });
    registerQuotaModule();
  }

  // ── Optional host-page integration (user-invisible seam) ──────────────
  // Runs after mount so the DOM (capsule, card, state) exists. Registered
  // only when the neutral runtime is present; never affects standalone use.
  function registerQuotaModule() {
    try {
      var rt = window.DSH_PLUGIN_INTEGRATION_V1;
      if (!rt) return;
      rt.register({
        id: 'quota',
        kind: 'resource',
        title: 'Quota',
        getSnapshot: function () {
          var rows = ROWS.map(function (spec) {
            var s = STATE[spec.id] || { status: 'loading', summary: '…' };
            var last = LASTMODEL[spec.id];
            return {
              id: spec.id,
              label: spec.label,
              format: spec.format,
              status: s.status,
              summary: s.summary,
              // A stale row still reports the reading it could last confirm, so
              // a consumer can tell "value is old" from "value is unknown".
              observedAt: last ? last.at : null
            };
          });
          // Stale/loading rows are excluded from the aggregate level: one failed
          // refresh is not an account problem, and when nothing has ever been
          // read the honest answer is "unknown".
          var levels = rows
            .map(function (r) { return r.status; })
            .filter(function (status) { return status !== 'stale' && status !== 'loading' && status !== 'unknown'; });
          var level = levels.indexOf('error') >= 0 ? 'error' : (levels.indexOf('warn') >= 0 ? 'warn' : (levels.length ? 'ok' : 'unknown'));
          var times = rows.map(function (r) { return r.observedAt || 0; });
          return { level: level, providers: rows, updatedAt: Math.max.apply(Math, [0].concat(times)) || null };
        },
        actions: {
          refresh: function () { refreshAll(); }
        },
        mountCompact: function (container) {
          // An optional host may provide a slot. A user's saved placement wins.
          if (!container || !container.isConnected || panelEl.contains(container) || pos) return;
          mountSlot = container;
          container.appendChild(panelEl);
          setExpanded(false);
        },
        unmountCompact: function () {
          if (!panelEl) return;
          mountSlot = null;
          document.body.appendChild(panelEl);
          setExpanded(false);
        },
        openDetail: function () {
          setExpanded(true);
        }
      });
    } catch { /* an exception here must never break the widget */ }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  } else {
    mount();
  }
})();</script></body>
